<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link rel="stylesheet" href="./css/styles.css" />

    <script type="module" src="./js/pokedex.js"></script>
  </head>

  <body>
    <nav>
      <a href="pokedex.html">Pokedex</a>
      <a href="favorites.html">Favorites</a>
    </nav>

    <div class="border">
      <div class="grid">
        <div class="header">
          <h1>What pokemon are you looking for?</h1>
          <img src="./images/pokemon.png" alt="" />
        </div>

        <input type="text" id="searchInput" placeholder="Search by name" />
        <div class="buttons">
          <select id="typeFilter">
            <option value="">All types</option>
            <option value="grass">Grass</option>
            <option value="fire">Fire</option>
            <option value="water">Water</option>
            <option value="electric">Electric</option>
            <option value="normal">Normal</option>
            <option value="bug">Bug</option>
            <option value="psychic">Psychic</option>
            <option value="poison">Poison</option>
            <option value="dark">Dark</option>
            <option value="fairy">Fairy</option>
            <option value="fighting">Fighting</option>
            <option value="ghost">Ghost</option>
            <option value="dragon">Dragon</option>
            <option value="steel">Steel</option>
            <option value="rock">Rock</option>
            <option value="flying">Flying</option>
            <option value="ground">Ground</option>
            <option value="ice">Ice</option>
          </select>

          <select id="generationSelect">
            <option value="1">Generation 1</option>
            <option value="2">Generation 2</option>
            <option value="3">Generation 3</option>
            <option value="4">Generation 4</option>
            <option value="5">Generation 5</option>
          </select>

          <button id="searchBtn">Search</button>
        </div>
      </div>
    </div>
    <div id="pokemon-list"></div>

    <div id="pokemonModal" class="hidden">
      <div class="modalCard">
        <h2 id="modalName"></h2>
        <img id="modalImage" src="" alt="" />
        <p><strong>Height:</strong> <span id="modalHeight"></span></p>
        <p><strong>Weight:</strong> <span id="modalWeight"></span></p>
        <h3>Abilities</h3>
        <ul id="modalAbilities"></ul>
        <h3>Stats</h3>
        <ul id="modalStats"></ul>
        <button id="closeModalBtn">Close</button>
      </div>
    </div>

    <script type="module" src="./js/pokedex.js"></script>
  </body>

  <footer><img src="./images/pokemonlogo.png" alt="" /></footer>
  <footer>© 2025 Pokedex Project - All Rights Reserved</footer>
</html>
