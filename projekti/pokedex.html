<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>

    <script type="module" src="./js/pokedex.js"></script>

    <style>
      .header {
        padding: 2.5rem 1.25rem;
        text-align: center-left;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="grid">
      <div class="grid-btn pokedex"></div>

    <div class="header"
    <h1>what pokemon are you looking for?</h1>
    <div id="pokemon-container"></div>
    <input type="text" id="search-name" placeholder="Search by name" />
    <select id="search-type">
      <option value="">All types</option>
      <option value="grass">grass</option>
      <option value="fire">fire</option>
      <option value="water">water</option>
      <option value="normal">normal</option>
      <option value="bug">bug</option>
      <option value="poison">poison</option>
      <option value="dark">dark</option>
      <option value="psychic">psychic</option>
      <option value="fairy">fairy</option>
      <option value="figting">fighting</option>
      <option value="ghost">ghost</option>
      <option value="dragon">dragon</option>
      <option value="electric">electric</option>
      <option value="steel">steel</option>
      <option value="rock">rock</option>
      <option value="flying">flying</option>
      <option value="ground">ground</option>
      <option value="ice">ice</option>
    </select>
    <button id="search-btn">Search</button>

    <select id="generation-select">
        <option value="1">Generation 1</option>
        <option value="2">Generation 2</option>
        <option value="3">Generation 3</option>
        <option value="4">Generation 4</option>
        <option value="5">Generation 5</option>
      </select>

      <button id="searchBtn">Search</button>
    </div>

    <div id="pokemonModal" class="hidden">
      <div>
        <button id="closeModalBtn">Close</button>

        <h2 id="modalName"></h2>
        <img id="modalImage" src="" alt="" />

        <p><strong>Height:</strong> <span id="modalHeight"></span></p>
        <p><strong>Weight:</strong> <span id="modalWeight"></span></p>

        <h3>Abilities</h3>
        <ul id="modalAbilities"></ul>

        <h3>Stats</h3>
        <ul id="modalStats"></ul>

      <button id="searchBtn">Search</button>
      </div>
    </div>
  </body>
</html>
